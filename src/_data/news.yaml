- date: 2026-06-01
  title: DCVLR paper at the ICML 2026 EMQA workshop
  description: >-
    The next iteration of “What Matters in Data Curation for Multimodal
    Reasoning? Insights from the DCVLR Challenge” will be presented at the ICML
