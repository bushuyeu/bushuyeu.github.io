- date: 2026-03-01
  title: ShepBERT at the UH Cancer Center × Google Cloud AI Research Workshop
  description: >-
    Presenting preliminary results from ShepBERT, a BERT-style clinical language
    model pre-trained on 230,000+ patient EHR records to predict one-year cancer
    risk, focused on Native Hawaiian and Pacific Islander populations, who carry
    a disproportionately high cancer burden relative to the mainland US.

- date: 2026-01-01
  title: New paper on data curation for multimodal reasoning
  description: >-
    “What Matters in Data Curation for Multimodal Reasoning? Insights from the
    DCVLR Challenge” describes our approach to balancing difficulty and
    diversity when sampling high-quality supervised datasets for multimodal
    models.
  href: https://arxiv.org/pdf/2601.10922

